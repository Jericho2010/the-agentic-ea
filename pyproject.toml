[project]
name = "the-agentic-ea"
version = "0.1.0"
description = "The Agentic EA: Autonomous Enterprise Architecture Platform on Databricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.30.0",
    "databricks-sql-connector>=3.0.0",
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.20.0",
    "networkx>=3.2.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "fastapi>=0.151.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
